<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AgriCare - Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">🌱</div>
                <h1>Smart AgriCare</h1>
                <p class="subtitle">Plant Disease Detection System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="form-group remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;">
                <p id="errorText"></p>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link">
                <p>Don't have an account? <a href="/signup">Sign up here</a></p>
            </div>

            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <p class="demo-label">Demo Credentials:</p>
                <p>Username: <strong>demo</strong></p>
                <p>Password: <strong>demo123</strong></p>
            </div>
        </div>

        <div class="login-footer">
            <p>Smart AgriCare © 2024 | Secure Plant Disease Detection</p>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
